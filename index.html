<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">

    <title>POKÉDEX</title>

    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="icon" type="image/png" href="https://cdn.pixabay.com/photo/2019/11/27/14/06/pokemon-4657023_1280.png">

    <script type="module" src="src/main.js"></script>
</head>
<body>
    <main class="pokedex-container">
        <h1 class="main-title">POKÉDEX</h1>

        <div id="poke-card">
            <div class="pokemon-img-container">
                <img id="pokemon-img" src="" alt="Pokemon Image">
            </div>

            <h1 id="pokemon-name">Pokemón</h1>
            <p id="pokemon-id">#000</p>

            <div class="types" id="pokemon-types"></div>
        
            <div id="buttons">
                <button class="prev" type="button">Previous</button>
                <button class="next"type="button">Next</button>
            </div>
        </div>
    </main>

    <!--Modal-->
    <div id="pokemon-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal">x</button>
            <img id="modal-img" src="" alt="Pokemon Image">
            <h2 id="modal-name"></h2>
            <p id="modal-id"></p>

            <div class="modal-info">
                <div>
                    <h3>Altura</h3>
                    <p id="modal-height"></p>
                </div>

                <div>
                    <h3>Peso</h3>
                    <p id="modal-weight"></p>
                </div>
            </div>

            <div class="modal-section">
                <h3>Habilidades</h3>
                <ul id="modal-abilities"></ul>
            </div>

            <div class="modal-section">
                <h3>Estadísticas</h3>
                <ul id="modal-stats"></ul>
            </div>
        </div>
    </div>
</body>
</html>
